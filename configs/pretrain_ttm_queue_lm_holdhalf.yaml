# ====== knowledge distillation ======
# exp9 teacher-target-mixing: 별도 KD ITC 블록은 target_mix와 상호배타이므로 OFF.
distill:
  itc:
    enabled: false          # 별도 KD OFF (target_mix와 상호배타)
    weight: 1.0
    temp: 0.05
  itc_target_mix:
    enabled: true
    variant: queue
    temp: 0.0157
    soft_weight: 0.4
    hold_epochs: 2
    decay_end_epochs: 42  # ★ 티처 상시 유지 (γ(ep20)=0.9999982, 20에폭 총 감쇠 1.8e-6)
  lm:
    enabled: true           # ★ exp9.3(ttm_queue_lm)과 동일하게 LM 증류 ON
    weight: 1.0
    temp: 2.0

teacher:
  arch: 'blip_large'
  # 공식 Salesforce BLIP-large pretrain (ViT-L + BERT-base, 디코더 포함).
  # BLIP 공식 README의 Pre-trained checkpoints 표에서 ViT-L(129M) 링크로 다운로드 후 경로 기입.
  # 빈 값이면 pretrain.py가 FileNotFoundError로 즉시 실패함 (무작위 티처 증류 방지).
