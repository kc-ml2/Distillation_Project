# ===== exp9.4: ITC target-mix(queue) + LM 증류, 티처 γ 상시 유지 =====
# 설계: docs/superpowers/specs/2026-07-14-teacher-target-mix-design.md
# 티처를 별도 KD 손실이 아니라 ITC soft-target에 녹여 gradient 충돌(cos<0) 제거.
#   target = 0.6·one-hot + 0.4·[γ·teacher + (1−γ)·momentum]
#   별도 KD(distill.itc)는 OFF, distill.itc_target_mix로 켠다. τ(itc_target_mix.temp)=0.05.
#
# exp9.3(pt_smallreg_minilm_ttm_queue_lm)과 다른 점은 **γ 스케줄 하나뿐**이다.
#   exp9.3 : hold_epochs=2, decay_end_epochs=12       -> ep2~12 선형 1->0, ep12+ γ=0
#   exp9.4 : hold_epochs=2, decay_end_epochs=10000000 -> 20에폭 전 구간 사실상 γ=1
#            ttm_gamma() = 1 - (step-hold)/(decay_end-hold) 이므로
#            γ(ep5)=0.9999997  γ(ep12)=0.9999990  γ(ep20)=0.9999982   (감쇠 총량 1.8e-6)
#            hold_steps=74,692 / decay_end_steps=373,460,000,000, assert hold<=decay_end 충족.
#            (정확히 γ≡1.0 을 원하면 hold_epochs 도 함께 크게 올려야 한다. 한쪽만 바꾸면
#             pretrain.py의 hold_epochs <= decay_end_epochs assert 에 걸린다.)
#
# ===== 동기 (2026-07-30 exp9.3 TB 실측) =====
# ★ 이 현상은 r_mean 으로는 보이지 않는다. 1차 판정 지표는 img_r1 / img_r_mean 이다.
#   exp9.3 step 300k -> 최종(746,920):
#     val_retrieval_itc/txt_r1     45.68 -> 50.24   (+4.56)   ← 계속 개선
#     val_retrieval_itc/img_r1     33.72 -> 33.11   (-0.62)   ← 최종이 중반보다 낮다
#     val_retrieval_itc/img_r_mean 57.17 -> 56.97   (-0.20)
#     val_retrieval_itc/r_mean     62.60 -> 64.31   (+1.71)   ← txt 개선이 img 후퇴를 상쇄해 가려버린다
#
#   img_r1 을 세 런에서 ep11~12 평균 -> ep18~20 평균으로 비교하면
#   (= 'γ가 사실상 사라진 뒤 8에폭 동안 개선되었는가'):
#     exp9.4 비교대상 exp9.3 (γ→0) : 34.25 -> 33.48  (-0.76)  ← 개선 정지 + 후퇴
#     exp8 lm_distill (γ 없음)     : 31.53 -> 33.44  (+1.91)
#     exp7 baseline   (티처 없음)   : 31.24 -> 32.41  (+1.17)
#
#   img_r1 peak 시점도 exp9.3만 학습 중반이다:
#     exp9.3 : 35.13 @ ep12.61  -> 최종 33.11 (-2.03)
#     exp8   : 34.44 @ ep19.68  -> 최종 34.03 (-0.41)
#     exp7   : 33.74 @ ep19.63  -> 최종 32.68 (-1.06)
#
#   단 step 함수형 '절벽'은 아니다. γ=0 도달(step 448,152 = ep12.0) 직후 450k~498k 구간은
#   33.6~34.4 로 유지되고, 그 뒤 506k(31.99)·546~554k(32.2/31.2)에서 31~34.6 대역 진동으로 바뀐다.
#   즉 **ep11~12에 천장을 치고 이후 8에폭을 회복 없이 진동만 한다.**
#   -> exp9.3의 우위는 티처 타깃이 있는 동안만 유지되고, 사라진 뒤 평범한 목적함수가 그 수준을 못 지탱한다.
#
# ===== 이 런이 판정하는 것 =====
#   (a) γ 감쇠가 원인이다  -> γ 유지 시 img_r1 이 ep12 이후에도 계속 오르고 peak가 학습 끝에 온다
#   (b) 학생 용량/τ 평형이 천장이다 -> γ 유지해도 img_r1 이 34 근처에서 정체하고 peak가 여전히 중반
#   통과 기준: ep18~20 평균 img_r1 > exp9.3의 ep11~12 평균 34.25, 그리고 peak 시점이 ep18 이후.
#   (참고: 이전 판 주석은 r_mean 만 보고 "우위가 ep2~11에 점진 소멸, baseline이 자연 수렴해 따라잡음"
#    이라고 적었는데 오독이었다. baseline이 따라잡은 게 아니라 exp9.3이 자기 peak에서 내려온 것이다.)
# 나머지 하이퍼는 exp9.3 / student baseline(exp7)과 동일 = 통제.
#
# 주의: pretrain.py에 `assert alpha == itc_target_mix.soft_weight` 가 있다(γ=0 tail-skip 불변식).
#       alpha=0.4 / soft_weight=0.4 로 충족. γ가 0에 도달하지 않으므로 tail-skip 경로는 타지 않는다.
output_dir: '/home/minwoo/Distillation_Project/output/pt_ttm_queue_lm_holdhalf_tctmp00157'

