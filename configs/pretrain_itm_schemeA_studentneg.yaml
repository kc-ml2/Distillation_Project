# ====== knowledge distillation (SCHEME B) ======
distill:
  itc:
    enabled: false
    weight: 1.0
    temp: 0.05
  itm_target_mix:
    enabled: true
    neg_source: student     # ★ 'teacher' | 'student' — baseline과 표집 동일화(위 주석 참고)
    variant: target_mix     # 확률 target-mix: (1-W)onehot + W*teacher_soft
    soft_weight: 1.0        # W — 1.0이면 하드 앵커 완전 제거 (원 schemeA와 동일)
    temp: 2.0               # T
    schedule: constant      # 'constant' only

teacher:
  arch: 'blip_large'
  checkpoint: '/home/minwoo/Distillation_Project/output/official_pretrain_checkpoint/model_large.pth'
