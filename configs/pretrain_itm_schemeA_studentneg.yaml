# ===== SCHEME A (재실행): tempered soft-target, 학생 표집 =====
# 원 schemeA(`output/pt_itm_schemeA_tempered`, exp 10.SA)와 손실은 완전히 동일:
#   loss_itm = -sum( softmax(u/T) * log_softmax(z) )      (variant: target_mix, W=1.0)
#   W=1.0이므로 하드 앵커가 없고 평형 gap이 sigma^-1(0.980)=3.9 로 캡된다 -> 양성 천장.
#
# 원 런과 다른 점은 **neg_source: teacher -> student 하나뿐**이다.
# 목적: 07-27 문서가 결론한 schemeA 사망 원인(양성 천장 = 손실 효과)이
#       실제로 손실 때문인지, 아니면 티처 표집(더 어려운 하드네거) 때문인지 분리한다.
#   - 메커니즘이 맞다면: 학생 표집으로 바꿔도 여전히 실패해야 한다(||w_d|| 정체, match_gap ~3.7 캡).
#   - 여전히 실패하면 schemeB와의 비교가 '손실 형태' 단일 요인으로 확정된다.
#   - 반대로 성공하면 07-24/07-27의 인과 서사가 틀렸다는 뜻 -> 전면 재검토.
#
# ★ neg_source=student (2026-07-30 변경). arm C·스킴 A는 teacher였고 baseline(하드라벨)은 학생 sim이라,
#   "baseline vs 증류" 비교에 손실과 네거티브 표집이 함께 섞여 있었다.
#   (티처 sel scale = 1/temp = 63.89 고정 vs 학생 exp(logit_scale) = 33.9@ep3 -> 57.1@ep15;
#    초기 에폭에서 티처 표집이 1.9배 뾰족 = 더 어려운 하드네거)
#   student로 두면 baseline과 표집이 동일해져 **손실만 다른 단일 요인 비교**가 된다.
#   부수 효과: derive_teacher_keep()이 ('itm',)만 반환 -> 티처가 vision_proj/text_proj/text_decoder를
#   내려놓고 ITC feats forward도 건너뛴다(더 가볍다). 티처는 학생이 만든 쌍의 확률만 내놓는 역할.
#   loss_itc_kd 로깅도 사라진다(티처 ITC feat이 없으므로).
output_dir: '/home/minwoo/Distillation_Project/output/pt_itm_schemeA_studentneg'

# experiment 태그 (tensorboard run 이름에 사용)
exp: '10.SA2_itm_tempered_studentneg'
# 이미지 증강 토글: distilled 런과 동일 조건 유지를 위해 ON
pretrain_train_aug: true

