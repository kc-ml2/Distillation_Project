val_loss_amp: true
#### 수정부분 끝 ####
###

#### 수정부분 시작: COCO Karpathy retrieval validation (momentum 없는 student-only R@1/5/10) ####
# ITC-only: 코사인 유사도만, 가벼움 (~10-30초) -> 자주 체크
# ITM rerank: ITC top-k를 ITM head로 재채점, 무거움 (~2-5분) -> 1시간에 한 번 꼴 (1 epoch ~4시간 실측 기준)
val_retrieval_enabled: true
val_retrieval_ann_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotations/'
val_retrieval_image_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/images/'
val_retrieval_split: 'val'
val_retrieval_batch_size: 64
val_retrieval_num_workers: 4
val_retrieval_amp: true
k_test: 128

val_retrieval_itc_interval_steps: 1000
val_retrieval_itc_epoch_end: true

val_retrieval_itm_interval_steps: 18675
val_retrieval_itm_epoch_end: true
#### 수정부분 끝 ####

# ── caption 메트릭 validation ──
val_caption_enabled: true
val_caption_ann_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotations/'
val_caption_image_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/images/'
val_caption_gt_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotation/coco_gt'
val_caption_split: 'val'
val_caption_batch_size: 32
val_caption_num_workers: 4
val_caption_mid_interval_steps: 18675   # ITM mid와 동일
val_caption_epoch_end: true
val_caption_use_spice: true             # epoch-end에서만 SPICE
caption_score_cpu_list: '0-31'          # 잡A '0-31' / 잡B '32-63' / null=캡 없음
caption_num_beams: 3
caption_max_length: 20
caption_min_length: 5
caption_prompt: ''

# batch 작아지면 init lr도 작아지고, 웜업 스텝을 늘려야한다

image_size: 224
# batch_size: 75 # 최초
batch_size: 40

queue_size: 57600
alpha: 0.4

# optimizer 기존에는 글로벌 배치가 3200이다. 32*75 = 2400, 즉 15분의 1로 줄여야한다는것
weight_decay: 0.05 # 유지
# init_lr: 3e-4 # 배치 75
init_lr: 1.0e-5 # 2.0e-5

# min_lr: 1.0e-6 최초
min_lr: 0.0667e-6
# warmup_lr: 1.0e-6 # 최초
warmup_lr: 0.0667e-6
lr_decay_rate: 0.9
max_epoch: 20 # 테스트용. 원래 얼마더라? 20임
# warmup_steps: 3000 # 배치 75 
warmup_steps: 37000

# ====== knowledge distillation (default OFF — never affects unrelated runs) ======
# 이 한 블록에서 itc/lm 증류 + teacher를 모두 제어한다. enabled: false면 코드가 KD 경로를 완전히 게이트.
distill:
  itc:
    enabled: true           # ITC relational KD (in-batch B×B KL). true면 pretrain_train_aug: true 필수
    weight: 1.0             # λ_itc — ⚠️ 잠정값. τ² 제거 + τ↓로 grad가 (1/τ)(q−p)≈45(q−p)로 증폭됨.
                            #        첫 런에서 loss_train/itc_kd가 ita(~7.7)/lm(~5.2) 대비 과하면 낮춰라.
    temp: 0.022             # τ. 티처 유사도 실측 pos-prob 0.46 (학생 수렴온도 0.023 앵커). critical_bugfix/ 참조
  lm:
    enabled: false          # LM logit KD. 이번 실험은 ITC-only이므로 끔
    weight: 1.0
    temp: 2.0               # T>1 (softening) — lm_distill_loss의 ×T² 유지가 맞음

teacher:
  arch: 'blip_large'        # 코드가 online_teacher를 vit=large, bert=base로 고정 로드
  checkpoint: '/home/minwoo/Distillation_Project/output/official_pretrain_checkpoint/model_large.pth'
