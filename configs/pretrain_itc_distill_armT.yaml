             '/home/minwoo/Distillation_Project/datasets/vision/vg/annotations/vg_train.json'
             ]
laion_path: ''
image_root_coco: '/home/minwoo/Distillation_Project/datasets/vision/coco/images/'
image_root_vg: '/home/minwoo/Distillation_Project/datasets/vision/vg/images/'

cc12m_tar_path: ''
cc12m_ratio: 5

used_dataset: 'coco_vg'

# ===== ITC distillation Phase 1 · Arm T (sharp) =====
# 설계 근거: critical_bugfix/2026-07-14_kd_grad_balance_and_geometry/README.md
# 6.1(τ0.022 λ1 drop-τ²)이 KD로 ITC를 2.6~6.7× 압도해 retrieval −3.9. 진단 후 Phase 1:
#   - 로스에 ×τ 보정(losses.py) → grad 크기가 τ에 무관해져 두 arm이 단일 λ로 자동 정합.
#   - λ_shared = weight = 2.5 (목표 ep0 ratio ~0.4, 6.1의 6.66 대비 16× 약). 자연 감쇠(anneal 없음).
# Arm T: τ=0.022 (diag질량 0.51·유효서포트 4.2, sharp — ITC와 가까움, 안전하나 marginal 정보 적음).
# Arm S(τ=0.05)와의 유일한 차이는 temp + caption CPU 분리. 나머지는 baseline(exp7)과 동일 = τ 1-변수 통제.
output_dir: '/home/minwoo/Distillation_Project/output/pt_smallreg_minilm_itc_distill_armT_t0.022'

# experiment 태그 (tensorboard run 이름에 사용)
exp: '6.3.itc_armT_xtau_t0.022'
# 이미지 증강 토글: 온라인 티처 증류는 augmentation ON 필수 (no-aug는 NO-GO였음)
pretrain_train_aug: true

# new) tenserboard log interval
tb_train_log_interval: 50
tb_val_log_interval: 1000

# ===== student architecture (pretrain_student.yaml과 동일 — baseline 대비 변인 통제) =====
vit: 'small_reg'
vit_grad_ckpt: False
vit_ckpt_layer: 0

my_bert_size: 'minilm'


## 벨리데이션 과정
#### COCO Karpathy validation loss ####
val_loss_enabled: true

val_loss_file: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotations/coco_karpathy_val.json'
val_loss_image_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/images/'

val_loss_batch_size: 32
val_loss_num_workers: 4
val_loss_caption_mode: first
val_loss_drop_last: true
val_loss_pin_memory: true

val_loss_print_freq: 50

val_loss_interval_steps: 500
val_loss_max_batches: 30 # 전체가 39더라

val_loss_epoch_end: true
val_loss_epoch_max_batches: 30

val_loss_alpha_mode: current
val_loss_restore_rng: true
val_loss_amp: true

#### COCO Karpathy retrieval validation (momentum 없는 student-only R@1/5/10) ####
val_retrieval_enabled: true
val_retrieval_ann_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotations/'
val_retrieval_image_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/images/'
val_retrieval_split: 'val'
val_retrieval_batch_size: 64
val_retrieval_num_workers: 4
val_retrieval_amp: true
k_test: 128

val_retrieval_itc_interval_steps: 1000
val_retrieval_itc_epoch_end: true

val_retrieval_itm_interval_steps: 18675
val_retrieval_itm_epoch_end: true

#### 학습 중 caption 지표 검증 (BLEU/METEOR/ROUGE/CIDEr/SPICE) — Arm T = 잡A(CPU 0-31) ####
val_caption_enabled: true
val_caption_ann_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotations/'
val_caption_image_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/images/'
val_caption_gt_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotation/coco_gt'
val_caption_split: 'val'
val_caption_batch_size: 32
val_caption_num_workers: 4
val_caption_mid_interval_steps: 18675   # ITM mid와 동일
val_caption_epoch_end: true
val_caption_use_spice: true             # epoch-end에서만 SPICE
caption_score_cpu_list: '0-31'          # Arm T(잡A). Arm S(잡B)는 '32-63' — 동시 SPICE 코어 충돌 방지

image_size: 224
batch_size: 40

queue_size: 57600
alpha: 0.4

weight_decay: 0.05
init_lr: 1.0e-5

min_lr: 0.0667e-6
warmup_lr: 0.0667e-6
lr_decay_rate: 0.9
max_epoch: 20
warmup_steps: 37000

# ====== knowledge distillation ======
# baseline(exp 7)과의 차이는 아래 itc 블록 하나뿐이어야 한다 (실험 통제).
distill:
  itc:
    enabled: true           # 이번 런은 ITC-only
    weight: 2.5             # λ_shared — ×τ 보정(losses.py) 위에서 목표 ep0 ratio ~0.4. Arm S와 공통.
    temp: 0.022             # τ (Arm T=sharp). model logit_scale와 별개.
  lm:
    enabled: false          # ITC-only 이므로 LM distill 끔
    weight: 1.0
    temp: 2.0

teacher:
  arch: 'blip_large'
  # 공식 Salesforce BLIP-large pretrain (ViT-L + BERT-base, 디코더 포함).
  # BLIP 공식 README의 Pre-trained checkpoints 표에서 ViT-L(129M) 링크로 다운로드 후 경로 기입.
  # 빈 값이면 pretrain.py가 FileNotFoundError로 즉시 실패함 (무작위 티처 증류 방지).
  checkpoint: '/home/minwoo/Distillation_Project/output/official_pretrain_checkpoint/model_large.pth'
