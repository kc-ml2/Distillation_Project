#### caption jtmetric (BLEU/METEOR/ROUGE/CIDEr/SPICE) — (CPU 0-63) ####
val_caption_enabled: true
val_caption_ann_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotations/'
val_caption_image_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/images/'
val_caption_gt_root: '/home/minwoo/Distillation_Project/datasets/vision/coco/annotation/coco_gt'
val_caption_split: 'val'
val_caption_batch_size: 32
val_caption_num_workers: 4
val_caption_mid_interval_steps: 18675   # mid-epoch
val_caption_epoch_end: true
val_caption_use_spice: true             # epoch-end에서만 SPICE
caption_score_cpu_list: '0-63'         # use all cores

image_size: 224
batch_size: 40

queue_size: 57600
alpha: 0.4

weight_decay: 0.05
init_lr: 1.0e-5

min_lr: 0.0667e-6
warmup_lr: 0.0667e-6
lr_decay_rate: 0.9
max_epoch: 20
warmup_steps: 37000

# ====== knowledge distillation toggle ======
# exp10 teacher-target-mixing: ITC block is exclusive option with itc_target_mix.
distill:
  itc:
    enabled: false          # dead config
    weight: 1.0
    temp: 0.05
  itc_target_mix:
    enabled: true
    variant: queue
    temp: 0.0157
    soft_weight: 0.4
    hold_epochs: 2
    decay_end_epochs: 42  
  itm:
    enabled: true
    weight: 1.0
    temp: 2.0             # traditional Hinton: softmax(z/T)+KL×T². ITM 로짓 std~2에 맞춘 중온(itc의 0.05 저온 오적용 정정). 스윕 {1,2}
    direction: bidir      # {forward, reverse, bidir}
    topk: 4               # -1=full B×B(Phase1); k<B-1=fixed 2-gather(Phase2). k≤4 safe on 24GB(k=8 OOMs); 스윕 {4,8,12}
  lm:
    enabled: true           # ★ exp9.3(ttm_queue_lm)과 동일하게 LM 증류 ON
    weight: 1.0
    temp: 2.0

teacher:
  arch: 'blip_large'
  # 공식 Salesforce BLIP-large pretrain (ViT-L + BERT-base, 디코더 포함).
  # BLIP 공식 README의 Pre-trained checkpoints 표에서 ViT-L(129M) 링크로 다운로드 후 경로 기입.
  # 빈 값이면 pretrain.py가 FileNotFoundError로 즉시 실패함 (무작위 티처 증류 방지).
  checkpoint: '/home/minwoo/Distillation_Project/output/official_pretrain_checkpoint/model_large.pth'
