# ===== 크레이터 root-cause 진단: γ 스케줄 실험 (2026-08-18) =====
# 배경: holdhalf(hold_epochs=2, decay_end=42)는 ep13.3~14.2 구간에서 txt_r1이 급락하는
#   "크레이터"가 재현됨(원본 τ=0.05, 재현 τ=0.0258 둘 다 동일 지점·동일 폭으로 크레이터
#   발생 → ttm_temp은 원인이 아님이 확인됨, project_refactor_itc_instability memory 참고).
#   holdteacher(γ≈1 상시)는 이 지점에서 안 터지고 대신 ep7-8/ep17-18에서 터짐 → 데이터
#   자체(same-epoch=same DistributedSampler shuffle, seed=0+epoch라 모든 런이 동일)가
#   아니라 "그 시점의 γ×logit_scale 조합"이 트리거라는 가설.
#
# 이 config가 검증하는 것: **크레이터 지점(ep13~14)에서 γ를 원본보다 낮게** 만들면
#   (원본 0.70~0.73 → 이 config 0.40~0.42) 크레이터가 사라지는가.
#   hold_epochs=-10 → γ=1 홀드 구간이 없어지고 스텝0부터 이미 감쇠가 진행중인 것으로 취급
#   (ttm_gamma()는 hold_epochs 음수를 막지 않음, hold_steps<=decay_end_steps만 assert).
#   decay_end_epochs=30 → 감쇠를 ep42가 아니라 ep30에서 끝냄(더 가파른 하강).
#   결과 γ(ep0)=0.75, γ(ep12)=0.45, γ(ep13)=0.42, γ(ep14)=0.40, γ(ep20)=0.25(0 도달 못함).
#
# ★ 처음부터(--checkpoint 없이) 돌리면 초반 2에폭 티처 scaffold(γ=1)가 사라져 학습 초반
#   궤적 자체가 바뀌므로, "그 지점만 γ가 낮아서 크레이터가 없어졌다"를 깨끗하게 검증할 수
#   없다. **반드시 ckpt_12(크레이터 직전, 원본 스케줄로 정상학습된 가중치)에서
#   --checkpoint output/pt_ttm_queue_lm_holdhalf/checkpoint_12.pth 로 재시작할 것.**
#   그러면 ep12까지는 원본과 완전히 동일한 궤적이고, 재개 순간 γ만 0.75→0.45로
#   불연속 하강하는 단일변수 자연실험이 된다.
#
# temp는 지난 검증 런(τ=0.0258, project_refactor_itc_instability memory의 "T*")과
# 동일하게 유지 — 이번 런의 변인은 γ 스케줄 하나뿐.
output_dir: '/home/minwoo/Distillation_Project/output/pt_ttm_queue_lm_holdhalf_gammalow'

